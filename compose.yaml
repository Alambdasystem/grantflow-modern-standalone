name: grantflow-lab
services:
  frontend-tests:
    image: grantflow-lab-frontend:latest
    profiles: [verify]
    entrypoint: [npm, run, test:unit]
    volumes:
      - ./source/frontend/tests:/app/tests:ro
    networks: [isolated]
    mem_limit: 768m

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - models:/root/.ollama
    networks: [isolated]
    mem_limit: 4g
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12

  tests:
    image: grantflow-lab-tests:local
    profiles: [verify]
    entrypoint: [python, /lab/run_suites.py]
    environment:
      PYTHONPATH: /lab:/app:/app/backend:/app/backend/tests
      AUTOMATION_WORKER_ENABLED: "false"
      INGESTION_LOCAL_WORKER_ENABLED: "false"
      RUN_LEGACY_STARTUP_IMPORTS: "false"
      DATABASE_URL: sqlite+aiosqlite:////tmp/unconfigured-test.db
      UPLOAD_DIR: /tmp/test-uploads
      SCREENSHOT_DIR: /tmp/test-screenshots
      INGESTION_STORAGE_DIR: /tmp/test-documents
      DEFAULT_ADMIN_USERNAME: ""
      DEFAULT_ADMIN_PASSWORD: ""
      DEFAULT_ADMIN_EMAIL: ""
      ANTHESIS_GFM_INTROSPECTION_SECRET: synthetic-contract-fixture-only
      ANTHESIS_IDENTITY_URL: http://identity:8000/api/gfm/introspect
      OLLAMA_URL: http://ai-disabled.invalid:11434
    volumes:
      - ./source:/app:ro
      - ./lab:/lab:ro
      - ./evidence:/evidence
    networks: [isolated]
    mem_limit: 1536m

  identity:
    build:
      context: .
      dockerfile: Dockerfile.identity
    environment:
      LAB_SERVICE_KEY: synthetic-contract-fixture-only
    networks: [isolated]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
    mem_limit: 128m
    security_opt: [no-new-privileges:true]

  backend:
    image: grantflow-lab-backend:local
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_NAME: GrantFlow Docker Lab
      ENVIRONMENT: isolated-lab
      DEBUG: "false"
      DATABASE_URL: sqlite+aiosqlite:////data/grantflow-lab.db
      UPLOAD_DIR: /data/uploads
      INGESTION_STORAGE_DIR: /data/private_documents
      SCREENSHOT_DIR: /data/screenshots
      GFM_BROWSER_PROFILE_DIR: /data/browser-profile
      AUTOMATION_WORKER_ENABLED: "true"
      INGESTION_LOCAL_WORKER_ENABLED: "true"
      RUN_LEGACY_STARTUP_IMPORTS: "false"
      ANTHESIS_IDENTITY_URL: http://identity:8000/api/gfm/introspect
      ANTHESIS_REVOKE_URL: http://identity:8000/api/gfm/revoke
      ANTHESIS_GFM_INTROSPECTION_SECRET: synthetic-contract-fixture-only
      SECRET_KEY: synthetic-lab-compatibility-key-only
      DEFAULT_ADMIN_USERNAME: ""
      DEFAULT_ADMIN_EMAIL: ""
      DEFAULT_ADMIN_PASSWORD: ""
      OLLAMA_URL: http://ollama:11434
      DEFAULT_MODEL: llama3.2:latest
      AI_PRELOAD_MODEL: "true"
      AI_LOAD_TIMEOUT_SECONDS: "180"
      AI_INFERENCE_TIMEOUT_SECONDS: "180"
      ALLOWED_ORIGINS: '["http://localhost:5100","http://127.0.0.1:5100"]'
    volumes:
      - data:/data
      - ./lab:/lab:ro
    networks: [isolated]
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      start_period: 20s
      retries: 15
    mem_limit: 1536m
    security_opt: [no-new-privileges:true]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        GFM_BACKEND_URL: http://backend:8001
    networks: [isolated]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/gfm-app/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 15
    mem_limit: 768m
    security_opt: [no-new-privileges:true]

  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:5100:8080"
    volumes:
      - ./lab/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [isolated, edge]
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 4s
      retries: 12
    mem_limit: 64m
    security_opt: [no-new-privileges:true]

  verify:
    image: grantflow-lab-backend:local
    profiles: [verify]
    entrypoint: [python, /lab/smoke.py]
    command: [--phase, create]
    user: "0:0"
    volumes:
      - ./evidence:/evidence
      - ./lab:/lab:ro
    networks: [isolated]
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 256m
    security_opt: [no-new-privileges:true]

volumes:
  data:
  models:
networks:
  isolated:
    internal: true
  edge:
    driver: bridge
