server {
    listen 8080;
    server_name localhost;
    # Allow multipart overhead; the API enforces the 20 MiB file limit.
    client_max_body_size 21m;
    access_log off;
    add_header X-Grantflow-Lab "synthetic-identity-fresh-data" always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","mode":"isolated-lab"}';
    }
    location /gfm-app {
        proxy_pass http://frontend:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 420s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://identity:8000;
        proxy_set_header Host $http_host;
    }
}
