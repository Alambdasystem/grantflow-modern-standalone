worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen __PORT__;
    server_name _;
    absolute_redirect off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    location = / { return 302 /auth/login; }
    location = /auth/login {
      alias /opt/staging/login.html;
      default_type text/html;
      limit_except GET { deny all; }
    }
    location = /health { proxy_pass http://127.0.0.1:8001/health; }
    location = /ready {
      default_type application/json;
      return 503 '{"ready":false,"authentication_ready":false,"ai_ready":false,"stage":"infrastructure-only"}';
    }
    location /gfm-app {
      proxy_pass http://127.0.0.1:3002;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ { proxy_pass http://127.0.0.1:8001; }
    location / { return 404; }
  }
}
